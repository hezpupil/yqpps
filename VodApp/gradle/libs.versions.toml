[versions]
agp = "9.3.3"
kotlin = "2.4.20"

# Compose BOM 2026.09 系列（ui 1.12.1、lifecycle 2.11.0 等）强制要求 compileSdk >= 37。
# Android 37 目前只在 SDK canary/preview 通道提供（目录名 android-37.1），不装它会
# 在 checkDebugAarMetadata 阶段直接失败。详见 README 第六节。
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.1"
coreKtx = "1.13.1"
coroutines = "1.11.0"

retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"

coil = "3.6.2"
# Media3 ExoPlayer：Google 官方维护，原生库自 1.2 起支持 16KB 内存页，适配 Android 15/16。
# 替换 IJKPlayer（0.8.8 预编译 so 仅 4KB 页，在 16KB 页设备上 native 崩溃）。
media3 = "1.11.0"

[libraries]
# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Compose（版本由 BOM 统一管理，不写版本号）
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 图标：Material3 本身不含图标，图标集来自 androidx.compose.material:material-icons-*
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# 协程
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# 网络
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }

# 图片
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 播放：Media3 ExoPlayer（官方维护，原生库支持 16KB 页，适配 Android 15/16）
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 内置 Kotlin，不再需要 org.jetbrains.kotlin.android 插件。
# kotlin 版本仍用于 compose 编译器插件，必须与实际编译用的 Kotlin 版本一致。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
