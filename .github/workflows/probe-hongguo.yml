name: Probe 红果模块（阶段0 可行性验证）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取 guoapp Go 核心
        uses: actions/checkout@v4
        with:
          repository: Xanerix/guoapp
          ref: main
          path: guoapp

      - name: 拉取红果模块
        uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          ref: v1.0.7
          path: guoapp/native/modules/hongguo

      - name: 拉取黄果AI模块
        uses: actions/checkout@v4
        with:
          repository: guoapp-modules/huangguoai
          ref: v1.0.1
          path: guoapp/native/modules/huangguoai

      - name: 安装 Go 并预编译 harness
        working-directory: guoapp/native
        run: |
          go build -o /tmp/moduletool ./cmd/moduletool
          echo "harness built"

      - name: 【红果】catalog 单独测试（带超时）
        working-directory: guoapp/native
        continue-on-error: true
        run: |
          echo "=== 红果 catalog short_play p1 ==="
          timeout 120 /tmp/moduletool ./modules/hongguo \
            '{"action":"catalog","source":"hongguo","category":"short_play","page":1}' 2>&1 | tail -5
          echo "EXIT=${PIPESTATUS[0]}"

      - name: 【红果】detail 测试
        working-directory: guoapp/native
        continue-on-error: true
        run: |
          timeout 120 /tmp/moduletool ./modules/hongguo \
            '{"action":"catalog","source":"hongguo","category":"","page":1}' 2>&1 | head -c 2500
          echo ""
          echo "EXIT=${PIPESTATUS[0]}"

      - name: 【黄果AI】榜单/列表测试
        working-directory: guoapp/native
        continue-on-error: true
        run: |
          echo "=== 黄果AI catalog ai-duanju ==="
          timeout 120 /tmp/moduletool ./modules/huangguoai \
            '{"action":"catalog","source":"huangguoai","category":"ai-duanju","page":1}' 2>&1 | head -c 2500
          echo ""
          echo "=== 黄果AI rankings ==="
          timeout 120 /tmp/moduletool ./modules/huangguoai \
            '{"action":"rankings","source":"huangguoai","board":"huangguo-hot","page":1}' 2>&1 | head -c 2500
          echo ""

      - name: 【红果】detail + resolve 全链路（数据层切换决策）
        working-directory: guoapp/native
        continue-on-error: true
        run: |
          CAT=$(timeout 150 /tmp/moduletool ./modules/hongguo \
            '{"action":"catalog","source":"hongguo","category":"short_play","page":1}' 2>/dev/null | tail -1)
          ID=$(echo "$CAT" | jq -r '.data.items[0].id // empty')
          TITLE=$(echo "$CAT" | jq -r '.data.items[0].title // empty')
          echo "剧集: $TITLE / ID: $ID"
          DETAIL=$(timeout 150 /tmp/moduletool ./modules/hongguo \
            "{\"action\":\"detail\",\"drama\":{\"id\":\"$ID\"}}" 2>/dev/null | tail -1)
          echo "=== DETAIL 摘要 ==="
          echo "$DETAIL" | head -c 1200
          echo ""
          CH0=$(echo "$DETAIL" | jq -c '.data.chapters[0] // empty')
          DRAMA=$(echo "$DETAIL" | jq -c '.data.drama // {}')
          echo "=== CHAPTER0 ==="
          echo "$CH0" | head -c 600
          echo ""
          echo "=== RESOLVE 全返回（url/headers/key）==="
          timeout 150 /tmp/moduletool ./modules/hongguo \
            "{\"action\":\"resolve\",\"sequence\":1,\"drama\":$DRAMA,\"chapter\":$CH0,\"index\":0}" 2>/dev/null \
            | tail -1 | head -c 2500
          echo ""
          echo "=== APP.LOG 错误线索 ==="
          timeout 30 true
