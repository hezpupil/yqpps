name: 编译 Go 短剧核心（native）

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: 安装 Android NDK
        id: ndk
        run: |
          export ANDROID_HOME=$RUNNER_TEMP/android-sdk
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          mkdir -p "$ANDROID_HOME/ndk" "$RUNNER_TEMP/ndk-tmp"
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d "$RUNNER_TEMP/ndk-tmp"
          EXTRACTED=$(find "$RUNNER_TEMP/ndk-tmp" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          mv "$EXTRACTED" "$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -3
          echo "ndk=$ANDROID_NDK_HOME" >> $GITHUB_OUTPUT
      - name: 编译 arm64-v8a
        working-directory: native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: 'off'
        run: |
          NDK="${{ steps.ndk.outputs.ndk }}"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          export CGO_CFLAGS="--target=aarch64-linux-android24 -I$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          export CGO_LDFLAGS="--target=aarch64-linux-android24 -Wl,-z,max-page-size=16384"
          set +e
          go build -trimpath -buildmode=c-shared -ldflags='-s -w' \
            -o ../VodApp/app/src/main/jniLibs/arm64-v8a/libyouqu_duanju.so ./bridge 2>&1 | tee /tmp/build64.log
          CODE=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$CODE"
          { echo '```'; cat /tmp/build64.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
      - name: 编译 armeabi-v7a
        working-directory: native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: 'off'
        run: |
          NDK="${{ steps.ndk.outputs.ndk }}"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          export CGO_CFLAGS="--target=armv7a-linux-androideabi24 -I$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          export CGO_LDFLAGS="--target=armv7a-linux-androideabi24 -Wl,-z,max-page-size=16384"
          go build -trimpath -buildmode=c-shared -ldflags='-s -w' \
            -o ../VodApp/app/src/main/jniLibs/armeabi-v7a/libyouqu_duanju.so ./bridge
      - name: 上传 .so
        uses: actions/upload-artifact@v4
        with:
          name: native-android-so
          path: VodApp/app/src/main/jniLibs/*/libyouqu_duanju.so
          retention-days: 7

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: 编译 iOS arm64 静态库
        working-directory: native
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: 'off'
        run: |
          mkdir -p ../ios/YouQuCore
          CC=$(xcrun -f clang)
          CGO_CFLAGS="-target arm64-apple-ios13.0" \
          CGO_LDFLAGS="-target arm64-apple-ios13.0" \
            go build -trimpath -buildmode=c-archive -ldflags='-s -w' \
              -o ../ios/YouQuCore/libYouQuDuanju.a ./bridge
          cp ../ios/YouQuCore/libYouQuDuanju.h ../ios/YouQuCore/include.h 2>/dev/null || true
      - name: 上传静态库
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-lib
          path: ios/YouQuCore/*
          retention-days: 7
